policies:
  - type: commit
    spec:
      header:
        length: 89
      conventional:
        types:
          - "feat"
          - "fix"
          - "perf"
          - "docs"
          - "test"
          - "chore"
          - "ci"
          - "build"
          - "refactor"
          - "style"
          - "revert"
        scopes:
          - ".*"
        descriptionLength: 72
